<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#243b53">
<title>Audit BKCO</title>
<style>
:root{
  --papier:#f6f7f8; --surface:#fff; --encre:#1a2028; --ardoise:#5a6672;
  --filet:#dfe3e7; --profond:#243b53; --ambre:#b8730e; --rouge:#a32f2a;
  --vert:#2e6b4f; --sable:#f0ece4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papier);color:var(--encre);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
select,input,textarea{background:var(--surface)}

#connexion{min-height:100dvh;display:grid;place-items:center;padding:24px}
.carte-connexion{width:100%;max-width:340px}
.carte-connexion h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
.carte-connexion p{color:var(--ardoise);margin:0 0 28px;font-size:14px}
.champ{display:block;margin-bottom:14px}
.champ span{display:block;font-size:13px;color:var(--ardoise);margin-bottom:5px}
.champ input,.champ select{width:100%;padding:11px 12px;border:1px solid var(--filet);border-radius:7px}
.champ input:focus,.champ select:focus{outline:2px solid var(--profond);outline-offset:1px}
.principal{width:100%;padding:12px;border-radius:7px;background:var(--profond);color:#fff;font-weight:600}
.principal:disabled{opacity:.5}

#app{display:none;min-height:100dvh;padding-bottom:78px}
header{position:sticky;top:0;z-index:10;background:var(--surface);
  border-bottom:1px solid var(--filet);padding:12px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
header .qui{margin-left:auto;font-size:13px;color:var(--ardoise)}
main{max-width:860px;margin:0 auto;padding:18px 16px}
h2{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.sous{color:var(--ardoise);font-size:14px;margin:0 0 20px}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);
  border-top:1px solid var(--filet);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 4px 13px;font-size:11px;color:var(--ardoise);
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font-size:16px;font-weight:400;line-height:1}
nav button[aria-current="page"]{color:var(--profond);font-weight:600;box-shadow:inset 0 2px 0 var(--profond)}
@media(min-width:800px){
  #app{padding-bottom:0}
  nav{position:sticky;top:53px;bottom:auto;border-top:0;border-bottom:1px solid var(--filet);
    max-width:860px;margin:0 auto}
  nav button{flex:0 0 auto;padding:12px 16px;font-size:14px;flex-direction:row;gap:7px}
}

.bloc{background:var(--surface);border:1px solid var(--filet);border-radius:9px;
  overflow:hidden;margin-bottom:16px}
.ligne{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid var(--filet);
  align-items:baseline;width:100%;text-align:left}
.ligne:last-child{border-bottom:0}
button.ligne:hover{background:var(--papier)}
.ligne .corps{flex:1;min-width:0}
.ligne .titre{font-weight:600;font-size:14.5px}
.ligne .detail{color:var(--ardoise);font-size:13px;margin-top:3px;word-break:break-word}
.montant{font-weight:650;white-space:nowrap}
.montant.negatif{color:var(--rouge)}

.etiquette{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:4px;
  background:var(--sable);color:var(--ardoise);font-weight:600}
.etiquette.urgent{background:#f7ede0;color:var(--ambre)}
.etiquette.expire{background:#f6e6e5;color:var(--rouge)}
.etiquette.ok{background:#e6efea;color:var(--vert)}

/* --- cartes d'analyse --- */
.carte{background:var(--surface);border:1px solid var(--filet);border-radius:11px;
  margin-bottom:12px;overflow:hidden}
.carte.ROUGE{border-left:5px solid var(--rouge)}
.carte.ORANGE{border-left:5px solid var(--ambre)}
.carte.VERT{border-left:5px solid var(--vert)}
.carte.GRIS{border-left:5px solid var(--filet)}
.tete{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;width:100%;text-align:left}
.tete:hover{background:var(--papier)}
.tete .nom{font-size:16px;font-weight:650;letter-spacing:-.01em}
.tete .verdict{color:var(--ardoise);font-size:13.5px;margin-top:5px;line-height:1.45}
.pastille{flex:0 0 auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;
  margin-top:2px}
.pastille.ROUGE{background:#f6e6e5;color:var(--rouge)}
.pastille.ORANGE{background:#f7ede0;color:var(--ambre)}
.pastille.VERT{background:#e6efea;color:var(--vert)}
.pastille.GRIS{background:var(--sable);color:var(--ardoise)}
.chiffres{display:flex;gap:0;border-top:1px solid var(--filet);background:var(--papier)}
.chiffres div{flex:1;padding:11px 12px;text-align:center;border-right:1px solid var(--filet)}
.chiffres div:last-child{border-right:0}
.chiffres b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.chiffres span{font-size:11.5px;color:var(--ardoise)}
.ia{padding:14px 16px;background:#eef2f6;color:var(--profond);font-size:14px;line-height:1.55;
  border-top:1px solid var(--filet)}
.raison{padding:4px 16px 14px}
.trait{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:13.5px;line-height:1.5}
.trait .marqueur{flex:0 0 auto;width:16px;text-align:center;font-weight:700;margin-top:1px}
.trait.charge .marqueur{color:var(--rouge)}
.trait.faveur .marqueur{color:var(--vert)}
.trait.neutre .marqueur{color:var(--ardoise)}
.trait.neutre{color:var(--ardoise)}
.evolution{padding:10px 16px;font-size:13.5px;border-top:1px solid var(--filet);
  display:flex;gap:8px;align-items:baseline}
.evolution b{font-variant-numeric:tabular-nums}
.ia .marque{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
  opacity:.65;margin-bottom:6px}
.sectionnette{padding:9px 16px;background:var(--papier);font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;color:var(--ardoise);
  border-top:1px solid var(--filet);border-bottom:1px solid var(--filet)}

.vide{padding:40px 20px;text-align:center;color:var(--ardoise)}
.vide b{display:block;color:var(--encre);margin-bottom:6px;font-size:15px}

.duo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.duo .champ{flex:1;min-width:170px;margin:0}
.progression{margin-bottom:16px;font-size:14px;color:var(--ardoise)}
.progression b{color:var(--encre)}
.jauge{height:5px;background:var(--filet);border-radius:3px;overflow:hidden;margin-bottom:8px}
.jauge span{display:block;height:100%;background:var(--profond);transition:width .3s}
.bouton-depot{flex:0 0 auto;align-self:center;padding:8px 14px;border:1px solid var(--filet);
  border-radius:7px;background:var(--surface);font-size:13.5px;font-weight:600}
.bouton-depot:hover{border-color:var(--profond);color:var(--profond)}
.bouton-depot.fait{border:0;background:transparent;color:var(--ardoise);font-weight:500}

.retour{color:var(--ardoise);font-size:14px;margin-bottom:12px;padding:4px 0}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14px}
dt{color:var(--ardoise)}
dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;word-break:break-word}
.zone{padding:14px}
textarea{width:100%;min-height:78px;padding:10px;border:1px solid var(--filet);
  border-radius:7px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.actions button{padding:9px 14px;border-radius:7px;border:1px solid var(--filet);
  background:var(--surface);font-size:14px;font-weight:500}
.actions button.fort{background:var(--profond);color:#fff;border-color:var(--profond)}

.alerte{padding:11px 13px;border-radius:7px;font-size:14px;margin-bottom:14px}
.alerte.erreur{background:#f6e6e5;color:var(--rouge)}
.alerte.info{background:#eef2f6;color:var(--profond)}
.explication{padding:11px 14px;background:#eef2f6;color:var(--profond);
  font-size:13.5px;line-height:1.45;border-bottom:1px solid var(--filet)}
.chargement{color:var(--ardoise);padding:30px;text-align:center}
</style>
</head>
<body>

<section id="connexion">
  <form class="carte-connexion" onsubmit="seConnecter(event)">
    <h1>Audit BKCO</h1>
    <p>Suivi des écarts de caisse et des ratios financiers.</p>
    <div id="err-connexion"></div>
    <label class="champ"><span>Adresse e-mail</span>
      <input id="email" type="email" autocomplete="username" required></label>
    <label class="champ"><span>Code</span>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
    <button class="principal" id="btn-connexion">Se connecter</button>
  </form>
</section>

<div id="app">
  <header>
    <h1>Audit BKCO</h1>
    <span class="qui" id="qui"></span>
    <button onclick="seDeconnecter()" style="color:var(--ardoise);font-size:13px">Quitter</button>
  </header>
  <nav id="nav"></nav>
  <main id="vue"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const E = {};
const $ = s => document.querySelector(s);
const eur = n => (n === null || n === undefined ? "—" :
  Number(n).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €");
const eur0 = n => (n === null || n === undefined ? "—" :
  Math.round(Number(n)).toLocaleString("fr-FR") + " €");
const jour = d => d ? new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"short"}) : "—";
const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const MOIS_FR = ["janvier","février","mars","avril","mai","juin",
                 "juillet","août","septembre","octobre","novembre","décembre"];
const moisLisible = m => m ? MOIS_FR[Number(m.slice(5,7)) - 1] + " " + m.slice(0,4) : "";

async function api(fichier, action, params = {}) {
  const r = await fetch("/api/" + fichier, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ action, jeton: E.jeton, ...params })
  });
  const d = await r.json();
  if (r.status === 401) { seDeconnecter(); throw new Error("Session expirée"); }
  if (d.erreur) throw new Error(d.erreur);
  return d;
}

/* ---------- connexion ---------- */

async function seConnecter(ev) {
  ev.preventDefault();
  const b = $("#btn-connexion"); b.disabled = true; b.textContent = "Connexion…";
  try {
    const r = await fetch("/api/audit", { method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"connexion", email:$("#email").value.trim(), pin:$("#pin").value }) });
    const d = await r.json();
    if (d.erreur) throw new Error(d.erreur);
    localStorage.setItem("jeton-audit", d.jeton);
    E.jeton = d.jeton;
    await demarrer();
  } catch (e) {
    $("#err-connexion").innerHTML = '<div class="alerte erreur">' + esc(e.message) + '</div>';
  } finally { b.disabled = false; b.textContent = "Se connecter"; }
}

function seDeconnecter() { localStorage.removeItem("jeton-audit"); location.reload(); }

async function demarrer() {
  const d = await api("audit", "moi");
  Object.assign(E, d);
  $("#connexion").style.display = "none";
  $("#app").style.display = "block";
  $("#qui").textContent = d.utilisateur.nom;
  const onglets = [["analyse","Analyse","◉"],["depot","Dépôt","+"],
                   ["libelles","Remises","%"],["equipe","Équipe","•"]];
  if (d.utilisateur.role === "DG") onglets.push(["admin","Accès","*"]);
  $("#nav").innerHTML = onglets.map(function(o){
    return '<button data-onglet="'+o[0]+'" onclick="aller(\''+o[0]+'\')"><b>'+o[2]+'</b>'+o[1]+'</button>';
  }).join("");
  aller(E.droits.lecture.length ? "analyse" : "depot");
}

function aller(onglet, params) {
  E.onglet = onglet;
  document.querySelectorAll("#nav button").forEach(function(b){
    b.setAttribute("aria-current", b.dataset.onglet === onglet ? "page" : "false"); });
  $("#vue").innerHTML = '<p class="chargement">Chargement…</p>';
  ({ analyse:vueAnalyse, depot:vueDepot, libelles:vueLibelles,
     equipe:vueEquipe, admin:vueAdmin }[onglet])(params).catch(afficherErreur);
}
const afficherErreur = e => $("#vue").innerHTML = '<div class="alerte erreur">' + esc(e.message) + '</div>';

function basculer(id) {
  const e = document.getElementById(id);
  if (e) e.style.display = e.style.display === "none" ? "block" : "none";
}
function momentLisible(s) {
  return { OUVERTURE:"ouverture", JOURNEE:"journée", FERMETURE:"fermeture" }[s] || "";
}
function resteCamera(echeance) {
  if (!echeance) return null;
  return Math.ceil((new Date(echeance) - new Date()) / 86400000);
}

/* =====================================================================
   ANALYSE — l'écran principal.
   Une carte par encadrant, un verdict, et une explication rédigée.
   Aucun tableau à interpréter : si un directeur doit comparer des
   colonnes pour comprendre, l'écran a raté son travail.
   ===================================================================== */

const MOT_FEU = { ROUGE:"À vérifier", ORANGE:"À surveiller", VERT:"Rien à signaler",
                  GRIS:"Trop peu de données" };

async function vueAnalyse(params) {
  const p = params || {};
  const restos = E.restaurants.filter(r => E.droits.lecture.indexOf(r.id) >= 0);
  if (!restos.length) { $("#vue").innerHTML =
    '<div class="vide"><b>Aucun restaurant</b>Vous n\'avez pas de droit de lecture.</div>'; return; }
  E.an = { restaurant_id: p.restaurant_id || (E.an && E.an.restaurant_id) || restos[0].id,
           mois: p.mois !== undefined ? p.mois : (E.an && E.an.mois) || null };
  const rid = E.an.restaurant_id;

  const d = await api("analyse", "synthese", { restaurant_id: rid, mois: E.an.mois });
  E.an.mois = d.mois;
  E.dossier = d;

  const selecteurs =
    '<div class="duo">' +
      '<label class="champ"><span>Restaurant</span><select onchange="aller(\'analyse\',' +
        '{restaurant_id:Number(this.value),mois:null})">' +
        restos.map(r => '<option value="' + r.id + '"' + (r.id === rid ? " selected" : "") +
          '>' + esc(r.nom) + '</option>').join("") + '</select></label>' +
      (d.mois_disponibles.length ? '<label class="champ"><span>Mois</span>' +
        '<select onchange="aller(\'analyse\',{mois:this.value})">' +
        d.mois_disponibles.map(m => '<option value="' + m + '"' +
          (m === d.mois ? " selected" : "") + '>' + moisLisible(m) + '</option>').join("") +
        '</select></label>' : '') +
    '</div>';

  if (!d.mois) { $("#vue").innerHTML = '<h2>Analyse</h2>' + selecteurs +
    '<div class="bloc"><div class="vide"><b>Aucune donnée</b>' +
    'Déposez les déclarations de caisse pour lancer l\'analyse.</div></div>'; return; }

  const r = d.resume;
  const rouges = d.encadrants.filter(e => e.feu === "ROUGE").length;

  $("#vue").innerHTML =
    '<h2>Analyse</h2>' +
    '<p class="sous">Une carte par encadrant. Le classement compare chacun aux autres ' +
      'encadrants du même restaurant, sur le même mois — pas à un seuil théorique.</p>' +
    selecteurs +
    '<div class="bloc"><div class="chiffres">' +
      '<div><b>' + r.sessions + '</b><span>caisses comptées</span></div>' +
      '<div><b class="' + (r.montant_manquants < 0 ? "montant negatif" : "") + '">' +
        eur0(r.montant_manquants) + '</b><span>manquants à expliquer</span></div>' +
      '<div><b>' + r.compensees + '</b><span>erreurs de saisie</span></div>' +
      '<div><b>' + rouges + '</b><span>encadrant(s) à vérifier</span></div>' +
    '</div>' +
    (r.caisse_a_regarder ? '<div class="explication">La caisse ' +
      esc(r.caisse_a_regarder.caisse) + ' concentre ' + r.caisse_a_regarder.taux_lourdes +
      ' % de comptages en manque sur ' + r.caisse_a_regarder.sessions + ' sessions. ' +
      'Quand une caisse décroche à volume comparable, cherchez d\'abord un problème de poste ' +
      'ou de procédure avant de regarder les personnes.</div>' : '') +
    '</div>' +
    (d.encadrants.length ? d.encadrants.map(carteEncadrant).join("")
      : '<div class="bloc"><div class="vide"><b>Aucun encadrant sur ce mois</b>' +
        'Déposez la déclaration de caisse de la période.</div></div>');
}

function carteEncadrant(e) {
  const id = "c" + String(e.code).replace(/[^A-Za-z0-9]/g, "");
  const hist = (e.historique || []).slice(-12);

  /* Le raisonnement est affiché, pas déduit : chaque ligne est une
     comparaison, en rouge si elle joue en défaveur, en vert si elle joue
     en faveur. Un directeur doit pouvoir contester une ligne précise. */
  const traits = (e.traits || []).map(function(t){
    const m = t.sens === "charge" ? "▲" : t.sens === "faveur" ? "▼" : "•";
    return '<div class="trait ' + t.sens + '"><span class="marqueur">' + m + '</span>' +
      '<span>' + esc(t.texte) + '</span></div>';
  }).join("");

  /* Le mois précédent du même encadrant, affiché sans dépliage : c'est
     souvent le signal le plus parlant et il était enterré. */
  const p = e.precedent;
  let evolution = "";
  if (p) {
    const av = Number(p.ecart_par_session) || 0, ap = Number(e.ecart_par_session) || 0;
    const sens = Math.abs(ap) > Math.abs(av) * 1.3 ? "aggrave"
               : Math.abs(ap) < Math.abs(av) * 0.7 ? "ameliore" : "stable";
    const mot = { aggrave:"en nette hausse", ameliore:"en amélioration", stable:"stable" }[sens];
    const coul = sens === "aggrave" ? "var(--rouge)" : sens === "ameliore" ? "var(--vert)" : "var(--ardoise)";
    evolution = '<div class="evolution"><span style="color:var(--ardoise)">Par rapport à ' +
      moisLisible(p.mois) + '</span><b style="margin-left:auto">' + eur(p.ecart_par_session) +
      ' → ' + eur(e.ecart_par_session) + '</b>' +
      '<span style="color:' + coul + ';font-weight:600">' + mot + '</span></div>';
  }

  const lignesFaits = (e.faits || []).map(function(f){
    const reste = resteCamera(f.echeance_camera);
    const camera = reste === null ? "" :
      reste < 0 ? " · images perdues" :
      reste === 0 ? " · caméra : dernier jour" :
      reste <= 4 ? " · caméra : encore " + reste + " j" : "";
    return '<div class="ligne"><div class="corps">' +
      '<div class="titre" style="font-weight:500">' + jour(f.date) + ' · ' +
        esc(f.equipier || "caisse non identifiée") + '</div>' +
      '<div class="detail">' + esc(momentLisible(f.shift)) + ' · caisse ' + esc(f.caisse || "—") +
        camera + '</div></div>' +
      '<div class="montant num negatif">' + eur(f.ecart) + '</div></div>';
  }).join("");

  const lignesMois = hist.map(function(h){
    const courant = h.mois === e.historique[e.historique.length - 1].mois;
    return '<div class="ligne"' + (courant ? ' style="background:var(--papier)"' : '') +
      '><div class="corps">' +
      '<div class="titre" style="font-weight:500">' + moisLisible(h.mois) + '</div>' +
      '<div class="detail">' + h.sessions + ' caisses validées · ' +
        (h.part_deficit || 0) + ' % en manque</div></div>' +
      '<div class="montant num negatif">' + eur(h.ecart_par_session) + '</div></div>';
  }).join("");

  const partResto = e.part_deficit_moyenne === null || e.part_deficit_moyenne === undefined
    ? "" : Math.round(e.part_deficit_moyenne) + " % en moyenne";

  return '<div class="carte ' + e.feu + '">' +
    '<button class="tete" onclick="basculer(\'' + id + '\')">' +
      '<div style="flex:1;min-width:0">' +
        '<div class="nom">' + esc(e.nom) + '</div>' +
        '<div class="verdict">' + esc(e.verdict) + '</div></div>' +
      '<span class="pastille ' + e.feu + '">' + MOT_FEU[e.feu] + '</span>' +
    '</button>' +
    '<div class="chiffres">' +
      '<div><b class="montant negatif">' + eur(e.ecart_par_session) + '</b>' +
        '<span>par caisse</span></div>' +
      '<div><b>' + eur(e.mediane_pairs) + '</b><span>médiane du restaurant</span></div>' +
      '<div><b>' + e.sessions + '</b><span>caisses validées</span></div>' +
    '</div>' +
    (traits ? '<div class="raison">' + traits + '</div>' : "") +
    evolution +
    '<div id="' + id + '" style="display:none">' +
      '<div id="ia' + id + '"></div>' +
      '<div style="padding:12px 16px"><button style="padding:9px 14px;' +
        'border-radius:7px;background:var(--profond);color:#fff;font-size:14px;font-weight:600" ' +

/* ---------- dépôt ---------- */

function moisDisponibles(n) {
  const l = [], d = new Date();
  for (let i = 0; i < (n || 14); i++) {
    const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    l.push([m.getFullYear() + "-" + String(m.getMonth() + 1).padStart(2,"0"),
            MOIS_FR[m.getMonth()] + " " + m.getFullYear()]);
  }
  return l;
}
function bornesMois(mois) {
  const an = Number(mois.slice(0,4)), m = Number(mois.slice(5,7));
  return [mois + "-01", mois + "-" + String(new Date(an, m, 0).getDate()).padStart(2,"0")];
}

async function vueDepot(params) {
  const restos = E.restaurants.filter(r => E.droits.depot.indexOf(r.id) >= 0);
  if (!restos.length) { $("#vue").innerHTML =
    '<div class="vide"><b>Aucun restaurant</b>Vous n\'avez pas de droit de dépôt.</div>'; return; }
  E.depot = {
    restaurant_id: (params && params.restaurant_id) || (E.depot && E.depot.restaurant_id) || restos[0].id,
    mois: (params && params.mois) || (E.depot && E.depot.mois) || moisDisponibles()[1][0]
  };
  const rid = E.depot.restaurant_id, mois = E.depot.mois;
  const bornes = bornesMois(mois);

  const d = await api("audit", "depots", { restaurant_id:rid, debut:bornes[0], fin:bornes[1] });
  const deposes = {};
  d.imports.forEach(function(i){
    if (i.statut === "OK" && !deposes[i.type_rapport_code]) deposes[i.type_rapport_code] = i; });
  const visibles = d.types.filter(t => t.obligatoire || deposes[t.code]);
  E.attendus = d.types.filter(t => t.obligatoire).length;
  E.faits = d.types.filter(t => t.obligatoire && deposes[t.code]).length;

  $("#vue").innerHTML =
    '<h2>Déposer les exports</h2>' +
    '<p class="sous">Dans Cash Système, choisissez le restaurant et la période, puis exportez ' +
      'en CSV chaque rapport de la liste. Elle suit l\'ordre du menu Audit.</p>' +
    '<div class="duo">' +
      '<label class="champ"><span>Restaurant</span><select onchange="aller(\'depot\',' +
        '{restaurant_id:Number(this.value),mois:\'' + mois + '\'})">' +
        restos.map(r => '<option value="' + r.id + '"' + (r.id === rid ? " selected" : "") +
          '>' + esc(r.nom) + '</option>').join("") + '</select></label>' +
      '<label class="champ"><span>Période</span><select onchange="aller(\'depot\',' +
        '{restaurant_id:' + rid + ',mois:this.value})">' +
        moisDisponibles().map(o => '<option value="' + o[0] + '"' +
          (o[0] === mois ? " selected" : "") + '>' + o[1] + '</option>').join("") +
        '</select></label>' +
    '</div>' +
    '<div class="progression"><div class="jauge"><span id="jauge" style="width:' +
      (E.attendus ? E.faits / E.attendus * 100 : 0) + '%"></span></div>' +
      '<b id="compteur">' + E.faits + ' sur ' + E.attendus + '</b>' +
      ' rapports déposés pour cette période</div>' +
    '<div class="bloc">' + visibles.map(t => ligneDepot(t, deposes[t.code])).join("") + '</div>' +
    '<div id="bilan"></div>' +
    '<p class="sous" style="margin-top:14px">Les rapports « chaque semaine » alimentent la ' +
      'vérification caméra : passé 14 jours, les images ne sont plus disponibles.</p>';
}

function ligneDepot(t, imp) {
  const id = "d" + t.code;
  const multi = t.code === "SYNTHESE_CA";
  return '<div class="ligne" id="l' + id + '"' + (imp ? ' data-fait="1"' : '') + '>' +
    '<div class="corps"><div class="titre">' + esc(t.libelle_menu) +
    (multi ? ' <span class="etiquette">archive ZIP ou 9 CSV</span>' : '') +
    (t.frequence === "HEBDO" ? ' <span class="etiquette">chaque semaine</span>' : '') +
    '</div><div class="detail">' +
    (imp ? 'déposé le ' + jour(imp.depose_le) + ' · ' + imp.nb_lignes + ' lignes'
         : esc(t.usage_audit || "à déposer")) + '</div></div>' +
    '<input type="file" id="' + id + '"' + (multi ? " multiple" : "") + ' accept=".csv,.zip" ' +
      'style="display:none" onchange="envoyer(this.files,\'' + t.code + '\',\'' + id + '\')">' +
    '<button class="bouton-depot' + (imp ? " fait" : "") + '" onclick="document.getElementById(\'' +
      id + '\').click()">' + (imp ? "Remplacer" : "Déposer") + '</button></div>';

/* La Synthèse CA par canal se télécharge en archive ZIP contenant ses neuf
   CSV : on l'ouvre dans le navigateur plutôt que de demander à chacun de la
   décompresser à la main. Les autres rapports passent tels quels. */
async function deplier(fichiers) {
  const sortie = [];
  for (const f of fichiers) {
    const estZip = /\.zip$/i.test(f.name);
    if (!estZip) { sortie.push({ name: f.name, contenu: await lireTexte(await f.arrayBuffer()) }); continue; }
    if (typeof JSZip === "undefined")
      throw new Error("La lecture des archives ZIP n'a pas pu se charger. Réessayez, ou "
        + "décompressez l'archive et déposez les CSV.");
    const zip = await JSZip.loadAsync(f);
    const noms = Object.keys(zip.files)
      .filter(n => /\.csv$/i.test(n) && !zip.files[n].dir && !n.startsWith("__MACOSX"));
    if (!noms.length) throw new Error(f.name + " ne contient aucun fichier CSV.");
    for (const n of noms.sort())
      sortie.push({ name: n.split("/").pop(),
                    contenu: await lireTexte(await zip.files[n].async("arraybuffer")) });
  }
  return sortie;
}

/* Cash Système exporte tantôt en UTF-8, tantôt en Windows-1252. Un « é »
   mal décodé devient un caractère de remplacement : on le détecte et on
   relit dans l'autre encodage plutôt que d'insérer des libellés illisibles. */
async function lireTexte(buffer) {
  const utf8 = new TextDecoder("utf-8").decode(buffer);
  if (utf8.indexOf("\uFFFD") < 0) return utf8;
  try { return new TextDecoder("windows-1252").decode(buffer); } catch { return utf8; }
}

/* Le dépôt se fait ligne par ligne, sans recharger l'écran : on peut
   enchaîner les rapports sans perdre le fil. */
async function envoyer(fichiers, codeAttendu, idLigne) {
  const rid = E.depot.restaurant_id;
  const bornes = bornesMois(E.depot.mois);
  const ligne = document.getElementById("l" + idLigne);
  const detail = ligne.querySelector(".detail");
  const bouton = ligne.querySelector(".bouton-depot");
  const dejaFait = ligne.dataset.fait === "1";
  bouton.disabled = true;
  const initial = bouton.textContent;
  bouton.textContent = "…";

  let ok = 0, lignesLues = 0, aQualifier = 0;
  const soucis = [];

  let aTraiter;
  try {
    detail.textContent = "lecture des fichiers…";
    aTraiter = await deplier(fichiers);
  } catch (e) {
    detail.innerHTML = '<span style="color:var(--rouge)">' + esc(e.message) + '</span>';
    bouton.disabled = false; bouton.textContent = initial; return;
  }

  for (const f of aTraiter) {
    detail.textContent = "envoi de " + f.name + "…";
    try {
      const contenu = f.contenu;
      const d = await api("import", "deposer", { contenu:contenu, nom_fichier:f.name,
        restaurant_id:rid, periode_debut:bornes[0], periode_fin:bornes[1] });
      const attendu = codeAttendu === "SYNTHESE_CA" ? "SYNTHESE" : codeAttendu;
      const recu = d.synthese ? "SYNTHESE" : d.type;
      const bonneCase = recu === attendu || (codeAttendu === "REMISES_50" && recu === "REMISES");
      if (!bonneCase) soucis.push(f.name + " contient un rapport " + recu + " : rangé au bon endroit");
      ok++; lignesLues += d.nb || 0;
      if (d.libelles_a_qualifier) aQualifier += d.libelles_a_qualifier.length;
    } catch (e) { soucis.push(f.name + " : " + e.message); }
  }

  // La détection tourne dans un appel séparé, avec son propre budget de temps :
  // enchaînée au dépôt, elle faisait dépasser la limite sur les gros rapports.
  let ecarts = 0;
  if (ok) {
    detail.textContent = "analyse en cours…";
    try {
      const a = await api("import", "analyser",
        { restaurant_id: rid, debut: bornes[0], fin: bornes[1] });
      ecarts = (a.anomalies && a.anomalies.creees) || 0;
    } catch (e) { soucis.push("analyse : " + e.message); }
  }

  if (ok) {
    ligne.dataset.fait = "1";
    bouton.textContent = "Remplacer";
    bouton.classList.add("fait");
    detail.innerHTML = '<span style="color:var(--vert);font-weight:600">✓ déposé</span> · ' +
      lignesLues + ' lignes' + (soucis.length ? ' · ' + soucis.map(esc).join(' · ') : '');
    if (!dejaFait) majJauge(1);
  } else {
    bouton.textContent = initial;
    detail.innerHTML = '<span style="color:var(--rouge)">' + esc(soucis.join(" · ")) + '</span>';
  }
  bouton.disabled = false;
  annoncer(aQualifier, ecarts);
}

function majJauge(n) {
  E.faits = Math.min((E.faits || 0) + n, E.attendus);
  const j = document.getElementById("jauge"), c = document.getElementById("compteur");
  if (j) j.style.width = (E.attendus ? E.faits / E.attendus * 100 : 0) + "%";
  if (c) c.textContent = E.faits + " sur " + E.attendus;
}

function annoncer(aQualifier, ecarts) {
  E.bilan = { qualif: (E.bilan ? E.bilan.qualif : 0) + aQualifier,
              ecarts: (E.bilan ? E.bilan.ecarts : 0) + (ecarts || 0) };
  const b = document.getElementById("bilan");
  if (!b) return;
  const p = ['<a href="#" onclick="aller(\'analyse\');return false">Voir l\'analyse' +
    (E.bilan.ecarts ? " · " + E.bilan.ecarts + " écart(s) détecté(s)" : "") + '</a>'];
  if (E.bilan.qualif) p.push('<a href="#" onclick="aller(\'libelles\');return false">' +
    E.bilan.qualif + ' remise(s) à qualifier</a>');
  b.innerHTML = '<div class="alerte info">' + p.join(" · ") + '</div>';
}

/* ---------- remises ---------- */

/* Une qualification n'est pas définitive : on se trompe, et un libellé
   change de sens d'une opération commerciale à l'autre. Les quatre états
   sont donc navigables et modifiables à tout moment. */

const ETATS_REMISE = [
  ["A_QUALIFIER", "À qualifier"],
  ["AUTORISE", "Normales"],
  ["OPERATION", "Opérations"],
  ["NON_AUTORISE", "Non autorisées"]
];
const MOT_ETAT = { A_QUALIFIER:"à qualifier", AUTORISE:"normale",
                   OPERATION:"opération commerciale", NON_AUTORISE:"non autorisée" };

async function vueLibelles(params) {
  const statut = (params && params.statut) || (E.rem && E.rem.statut) || "A_QUALIFIER";
  E.rem = { statut: statut };
  const d = await api("audit", "libelles", { statut: statut });
  const c = d.compte || {};

  const onglets = '<div class="actions" style="margin:0 0 16px">' +
    ETATS_REMISE.map(function(o){
      return '<button' + (statut === o[0] ? ' class="fort"' : '') +
        ' onclick="aller(\'libelles\',{statut:\'' + o[0] + '\'})">' + o[1] +
        ' <span style="opacity:.7">' + (c[o[0]] || 0) + '</span></button>';
    }).join("") + '</div>';

  if (!d.libelles.length) {
    $("#vue").innerHTML = '<h2>Remises</h2>' +
      '<p class="sous">Chaque libellé de remise rencontré dans les exports est classé ici. ' +
        'Vous pouvez revenir sur un classement à tout moment.</p>' + onglets +
      '<div class="bloc"><div class="vide"><b>Aucun libellé dans cet état</b>' +
      'Changez d\'onglet pour voir les autres.</div></div>';
    return;
  }

  const familles = {};
  d.libelles.forEach(function(l){
    const f = l.famille || "SANS FAMILLE";
    (familles[f] = familles[f] || []).push(l);
  });
  const noms = Object.keys(familles).sort(function(a,b){
    return familles[b].length - familles[a].length; });

  $("#vue").innerHTML =
    '<h2>Remises</h2>' +
    '<p class="sous">Chaque libellé de remise rencontré dans les exports est classé ici. ' +
      'Qualifiez une famille entière en un clic, ou descendez au libellé. ' +
      'Un classement se corrige à tout moment.</p>' + onglets +
    noms.map(function(f){
      const l = familles[f], ids = l.map(x => x.id).join(",");
      const cle = "g" + f.replace(/[^a-zA-Z0-9]/g,"");
      return '<div class="bloc"><div class="ligne"><div class="corps">' +
        '<div class="titre">' + esc(f) + ' <span class="etiquette">' + l.length +
          ' libellé(s)</span></div>' +
        '<div class="detail">' + esc(l.slice(0,3).map(x => x.libelle).join(" · ")) +
        (l.length > 3 ? " · et " + (l.length - 3) + " autre(s)" : "") + '</div>' +
        '<div class="actions">' +
        boutonsRemise(ids, statut) +
        '<button onclick="basculer(\'' + cle + '\')">Voir le détail</button>' +
        '</div></div></div>' +
        '<div id="' + cle + '" style="display:none">' +
        l.map(function(x){
          return '<div class="ligne"><div class="corps"><div class="titre">' +
            esc(x.libelle) + '</div>' +
            '<div class="detail">Vu du ' + jour(x.premiere_vue) + ' au ' + jour(x.derniere_vue) +
              ' · actuellement ' + MOT_ETAT[x.statut] +
              (x.neutralise_ratio ? ' · exclue des ratios' : '') + '</div>' +
            '<div class="actions">' + boutonsRemise(String(x.id), x.statut) +
            '</div></div></div>';
        }).join("") + '</div></div>';
    }).join("");
}

/* On n'affiche jamais le bouton de l'état courant : cliquer sur « Normale »
   un libellé déjà normal ne fait rien et laisse croire à un bug. */
function boutonsRemise(ids, statutActuel) {
  const b = [];
  if (statutActuel !== "AUTORISE")
    b.push('<button onclick="qualifierLot([' + ids + '],\'AUTORISE\',0)">Normale</button>');
  if (statutActuel !== "OPERATION")
    b.push('<button onclick="qualifierLot([' + ids + '],\'OPERATION\',1)">Opération commerciale</button>');
  if (statutActuel !== "NON_AUTORISE")
    b.push('<button onclick="qualifierLot([' + ids + '],\'NON_AUTORISE\',0)">Non autorisée</button>');
  if (statutActuel !== "A_QUALIFIER")
    b.push('<button onclick="qualifierLot([' + ids + '],\'A_QUALIFIER\',0)">Remettre à qualifier</button>');
  return b.join("");
}

async function qualifierLot(ids, statut, neutralise) {
  for (const id of ids)
    await api("audit", "qualifierLibelle", { id:id, statut:statut, neutralise:neutralise });
  aller("libelles", { statut: E.rem.statut });
}

/* ---------- équipe ---------- */

/* Le pivot de tout le dispositif. Sans correspondance badge → nom, les
   écarts restent des trigrammes et personne ne peut les traiter. L'écran
   doit donc être modifiable, et signaler les badges vus dans les données
   qui n'ont jamais été enregistrés. */

const FONCTIONS = ["EQUIPIER","LEADER","SHIFT_LEADER","MANAGER","DIRECTEUR"];
const POSTES = ["DRIVE","BORNE","COMPTOIR","MIXTE"];

// Règle de construction des badges Cash Système : 4 lettres du nom + 3 du
// prénom. BAUDRY Laurence donne BAUDLAU. C'est une proposition, pas une
// déduction : le directeur valide.
function badgeProbable(nomComplet) {
  const t = String(nomComplet || "").trim().split(/\s+/);
  if (t.length < 2) return "";
  return (t[0].slice(0,4) + t[1].slice(0,3)).toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

async function vueEquipe(params) {
  const restos = E.restaurants.filter(r => E.droits.lecture.indexOf(r.id) >= 0);
  const rid = (params && params.restaurant_id) || (E.eq && E.eq.restaurant_id)
    || (restos[0] && restos[0].id);
  if (!rid) { $("#vue").innerHTML = '<div class="vide"><b>Aucun restaurant</b></div>'; return; }
  E.eq = { restaurant_id: rid };
  const d = await api("audit", "salaries", { restaurant_id: rid });
  E.salaries = d.salaries;

  const aValider = d.salaries.filter(s => s.confiance_mapping !== "VALIDE").length;

  $("#vue").innerHTML =
    '<h2>Équipe</h2>' +
    '<p class="sous">C\'est ici que les badges de caisse deviennent des noms. ' +
      'Tant qu\'un badge n\'est pas renseigné, ses écarts restent illisibles dans l\'analyse.</p>' +
    '<label class="champ"><span>Restaurant</span>' +
      '<select onchange="aller(\'equipe\',{restaurant_id:Number(this.value)})">' +
      restos.map(r => '<option value="' + r.id + '"' + (r.id === rid ? " selected" : "") + '>' +
        esc(r.nom) + '</option>').join("") + '</select></label>' +

    (d.inconnus.length ? '<div class="bloc">' +
      '<div class="explication">' + d.inconnus.length + ' badge(s) apparaissent dans vos ' +
        'exports sans être enregistrés ici. Cliquez pour les compléter.</div>' +
      d.inconnus.map(function(b){
        return '<button class="ligne" onclick="formulaireSalarie(null,\'' + b + '\')">' +
          '<div class="corps"><div class="titre">' + esc(b) + '</div>' +
          '<div class="detail">vu dans les données, jamais enregistré</div></div>' +
          '<span class="etiquette urgent">à compléter</span></button>';
      }).join("") + '</div>' : "") +

    '<div class="bloc">' +
      (aValider ? '<div class="explication">' + aValider + ' fiche(s) reposent sur une ' +
        'correspondance proposée automatiquement. Vérifiez le nom avant de valider : ' +
        'un badge attribué à la mauvaise personne fausse toute l\'analyse.</div>' : "") +
      (d.salaries.length ? d.salaries.map(function(s){
        return '<button class="ligne" onclick="formulaireSalarie(' + s.id + ')">' +
          '<div class="corps"><div class="titre">' + esc(s.badge_code) +
            (s.nom_complet ? " · " + esc(s.nom_complet) : "") + '</div><div class="detail">' +
            esc(s.fonction || "fonction à préciser") + ' · ' +
            esc(s.poste_habituel || "poste à préciser") + '</div></div>' +
          (s.confiance_mapping === "VALIDE" ? '<span class="etiquette ok">validé</span>'
                                            : '<span class="etiquette urgent">à valider</span>') +
          '</button>';
      }).join("") : '<div class="vide"><b>Aucun salarié</b>' +
        'Les badges apparaîtront après le premier dépôt.</div>') +
    '</div>' +
    '<div class="actions"><button class="fort" onclick="formulaireSalarie(null)">' +
      'Ajouter une personne</button></div>' +
    '<div id="formulaire"></div>';
}

function formulaireSalarie(id, badgePropose) {
  const s = id ? (E.salaries.find(x => x.id === id) || {}) : {};
  const badge = badgePropose || s.badge_code || "";
  const z = document.getElementById("formulaire");
  z.innerHTML =
    '<div class="bloc"><div class="zone">' +
      '<h3 style="margin:0 0 12px;font-size:15px">' +
        (id ? "Modifier " + esc(badge) : badgePropose ? "Compléter " + esc(badgePropose)
                                                      : "Ajouter une personne") + '</h3>' +
      '<label class="champ"><span>Nom et prénom</span>' +
        '<input id="s-nom" value="' + esc(s.nom_complet || "") + '" ' +
        'oninput="proposerBadge()" placeholder="BAUDRY Laurence"></label>' +
      '<label class="champ"><span>Badge en caisse</span>' +
        '<input id="s-badge" value="' + esc(badge) + '" placeholder="BAUDLAU"></label>' +
      '<p class="sous" id="s-aide" style="margin:-8px 0 14px;font-size:12.5px"></p>' +
      '<label class="champ"><span>Fonction</span><select id="s-fonction">' +
        '<option value="">à préciser</option>' +
        FONCTIONS.map(f => '<option value="' + f + '"' +
          (s.fonction === f ? " selected" : "") + '>' + f.replace("_", " ") + '</option>').join("") +
        '</select></label>' +
      '<label class="champ"><span>Poste habituel</span><select id="s-poste">' +
        '<option value="">à préciser</option>' +
        POSTES.map(p => '<option value="' + p + '"' +
          (s.poste_habituel === p ? " selected" : "") + '>' + p + '</option>').join("") +
        '</select></label>' +
      '<label class="champ"><span>Date de prise de poste (facultatif)</span>' +
        '<input id="s-date" type="date" value="' + esc(s.date_prise_poste || "") + '"></label>' +
      '<p class="sous" style="font-size:12.5px;margin-bottom:14px">Un changement de poste remet ' +
        'la comparaison à zéro : le taux d\'espèces d\'un caissier passé du drive à la borne ' +
        'bouge pour une raison parfaitement légitime.</p>' +
      '<div id="err-salarie"></div>' +
      '<div class="actions" style="margin-top:0">' +
        '<button class="fort" onclick="enregistrerSalarie(' + (id || "null") + ')">' +
          'Enregistrer et valider</button>' +
        '<button onclick="document.getElementById(\'formulaire\').innerHTML=\'\'">Annuler</button>' +
        (id ? '<button style="color:var(--rouge)" onclick="supprimerSalarie(' + id + ')">' +
          'Supprimer</button>' : "") +
      '</div>' +
    '</div></div>';
  z.scrollIntoView({ behavior: "smooth", block: "nearest" });
  proposerBadge();
}

function proposerBadge() {
  const nom = ($("#s-nom") || {}).value || "";
  const champ = $("#s-badge"), aide = $("#s-aide");
  if (!champ || !aide) return;
  const propose = badgeProbable(nom);
  if (propose && !champ.value) champ.value = propose;
  aide.textContent = propose && champ.value !== propose
    ? "Le badge attendu pour ce nom serait " + propose + ". Vérifiez avant d'enregistrer."
    : propose ? "Badge construit sur 4 lettres du nom + 3 du prénom." : "";
}

async function enregistrerSalarie(id) {
  const badge = $("#s-badge").value.trim().toUpperCase();
  const nom = $("#s-nom").value.trim();
  if (!badge) { $("#err-salarie").innerHTML =
    '<div class="alerte erreur">Le badge est obligatoire.</div>'; return; }
  try {
    await api("audit", "majSalarie", { id: id || undefined,
      restaurant_id: E.eq.restaurant_id, badge_code: badge, nom_complet: nom || null,
      fonction: $("#s-fonction").value || null, poste_habituel: $("#s-poste").value || null,
      date_prise_poste: $("#s-date").value || null });
    aller("equipe", { restaurant_id: E.eq.restaurant_id });
  } catch (e) {
    $("#err-salarie").innerHTML = '<div class="alerte erreur">' + esc(e.message) + '</div>';
  }
}

async function supprimerSalarie(id) {
  try {
    await api("audit", "supprimerSalarie", { id: id, restaurant_id: E.eq.restaurant_id });
    aller("equipe", { restaurant_id: E.eq.restaurant_id });
  } catch (e) {
    $("#err-salarie").innerHTML = '<div class="alerte erreur">' + esc(e.message) + '</div>';
  }
}

/* ---------- accès ---------- */

async function vueAdmin() {
  const d = await api("audit", "utilisateurs");
  $("#vue").innerHTML =
    '<h2>Accès</h2>' +
    '<p class="sous">Un directeur dépose et consulte son restaurant. Seuls la direction et les ' +
      'superviseurs peuvent clore un écart.</p>' +
    '<div class="bloc">' + d.utilisateurs.map(function(u){
      const n = d.perimetres.filter(p => p.utilisateur_id === u.id).length;
      return '<div class="ligne"><div class="corps"><div class="titre">' + esc(u.nom) + '</div>' +
        '<div class="detail">' + esc(u.role) + ' · ' + n + ' restaurant(s) · ' +
        (u.derniere_connexion ? "vu le " + jour(u.derniere_connexion) : "jamais connecté") +
        '</div></div>' + (u.actif ? "" : '<span class="etiquette">inactif</span>') + '</div>';
    }).join("") + '</div>' +
    '<div class="bloc"><div class="zone">' +
      '<h3 style="margin:0 0 12px;font-size:15px">Ajouter une personne</h3>' +
      '<label class="champ"><span>Nom</span><input id="n-nom"></label>' +
      '<label class="champ"><span>E-mail</span><input id="n-email" type="email"></label>' +
      '<label class="champ"><span>Rôle</span><select id="n-role">' +
        '<option value="DIRECTEUR">Directeur</option>' +
        '<option value="SUPERVISEUR">Superviseur</option>' +
        '<option value="CDG">Contrôle de gestion</option>' +
        '<option value="DG">Direction générale</option></select></label>' +
      '<label class="champ"><span>Code (6 chiffres minimum si la personne peut clore)</span>' +
        '<input id="n-pin" inputmode="numeric"></label>' +
      '<label class="champ"><span>Restaurants</span>' +
        '<select id="n-restos" multiple size="7">' +
        E.restaurants.map(r => '<option value="' + r.id + '">' + esc(r.nom) + '</option>').join("") +
        '</select></label><div id="err-admin"></div>' +
      '<button class="principal" onclick="creerUtilisateur()">Créer l\'accès</button>' +
    '</div></div>';
}

async function creerUtilisateur() {
  const role = $("#n-role").value;
  const clot = role !== "DIRECTEUR";
  const perimetres = Array.prototype.map.call($("#n-restos").selectedOptions, function(o){
    return { restaurant_id:Number(o.value), peut_deposer:true, peut_lire:true, peut_cloturer:clot }; });
  try {
    await api("audit", "creerUtilisateur", { nom:$("#n-nom").value.trim(),
      email:$("#n-email").value.trim(), role:role, pin:$("#n-pin").value.trim(),
      perimetres:perimetres });
    aller("admin");
  } catch (e) { $("#err-admin").innerHTML = '<div class="alerte erreur">' + esc(e.message) + '</div>'; }
}

/* ---------- amorçage ---------- */

E.jeton = localStorage.getItem("jeton-audit");
if (E.jeton) demarrer().catch(seDeconnecter);
</script>
